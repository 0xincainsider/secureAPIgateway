# =============================================================================
# Secure API Gateway - Docker Compose
# =============================================================================
# This configuration sets up the complete stack including:
#   - API Gateway (FastAPI)
#   - PostgreSQL (Database)
#   - Redis (Cache & Rate Limiting)
#   - Prometheus (Metrics Collection)
#   - Grafana (Metrics Visualization)
#
# Usage:
#   docker compose up -d
# =============================================================================

services:
  # --- API Gateway ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-long-random-secret-key-in-production}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-}
      - EMAIL_VERIFICATION_TOKEN_EXPIRE_MINUTES=60
      - DATABASE_URL=postgresql+asyncpg://gateway:gateway_secret@postgres:5432/secure_gateway
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_ENABLED=true
      - LOG_LEVEL=INFO
      - ALLOWED_HOSTS=*
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - ENABLE_RATE_LIMIT=true
      - ENABLE_SECURITY_HEADERS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: secure-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_secret
      POSTGRES_DB: secure_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d secure_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: secure-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: secure-api-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - gateway-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      api:
        condition: service_healthy

  # --- Grafana ---
  grafana:
    image: grafana/grafana:11.2.0
    container_name: secure-api-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/api-gateway-dashboard.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    networks:
      - gateway-network
    depends_on:
      - prometheus

networks:
  gateway-network:
    name: secure-api-gateway-network
    driver: bridge

volumes:
  postgres-data:
    name: secure-api-postgres-data
  redis-data:
    name: secure-api-redis-data
  prometheus-data:
    name: secure-api-prometheus-data
  grafana-data:
    name: secure-api-grafana-data
