# =============================================================================
# Prometheus Configuration for Secure API Gateway
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alerting configuration (can be extended with Alertmanager)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files (can be extended with custom alerting rules)
rule_files: []

# Scrape configurations
scrape_configs:
  # API Gateway metrics
  - job_name: "secure-api-gateway"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "api-gateway"
          environment: "production"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          environment: "production"
